{% extends "base.html" %}
{% block title %}관리자 로그인 · 문의함{% endblock %}
{% block body %}
  <div class="brand">
    <div class="brand-mark">문</div>
    <div class="brand-text">
      <strong>문의함</strong>
      <span>관리자</span>
    </div>
  </div>

  <section class="hero">
    <h1>관리자 로그인</h1>
    <p>문의 목록과 상담 상태를 관리합니다.</p>
  </section>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form accept-charset="UTF-8" class="card" method="post" action="/admin/login">
    <div class="field">
      <label for="password">비밀번호</label>
      <input class="control" id="password" name="password" type="password"
             required autocomplete="current-password" placeholder="관리자 비밀번호" />
    </div>
    <button class="btn btn-accent" type="submit">로그인</button>
  </form>
{% endblock %}
